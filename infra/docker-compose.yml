# Local stand-ins for the two managed services Taskspace needs: Postgres and an
# S3 bucket. In production both are third-party — this file exists so a laptop
# can run the same code paths without an AWS account.
name: taskspace

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskspace}
      POSTGRES_DB: ${POSTGRES_DB:-taskspace}
    ports:
      # Bound to loopback: the API is the only thing that needs this, and a
      # published 0.0.0.0 port puts the database on the public internet.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskspace} -d ${POSTGRES_DB:-taskspace}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Stands in for the third-party bucket. Same S3 API, so the application code
  # that talks to it is the code that will talk to S3/R2/Wasabi in production.
  minio:
    # quay.io, not Docker Hub: the minio/* repositories there now refuse anonymous pulls.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: taskspace-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-taskspace}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-taskspace-secret}
    ports:
      # Loopback for the same reason. In production the bucket is third-party
      # and this container is not used at all; locally the browser reaches it
      # through the dev server on the same machine.
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the bucket and allow browser PUT/GET from the app origin,
  # because presigned uploads are cross-origin XHR from the SPA.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: taskspace-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-taskspace}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-taskspace}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-taskspace-secret}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET &&
      echo 'bucket ready: '$$S3_BUCKET
      "

volumes:
  pgdata:
  miniodata:
